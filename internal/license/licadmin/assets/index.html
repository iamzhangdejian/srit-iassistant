<!doctype html>
<html lang="zh-CN" data-theme="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国研智研体 · 授权管理</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="brand__glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.8 4.4 7v10L12 21.2 19.6 17V7z"/>
          <path d="M12 7.6 8.2 9.8v4.4L12 16.4l3.8-2.2V9.8z"/>
        </svg>
      </span>
      <div class="brand__text">
        <strong>国研智研体</strong>
        <span>授权管理控制台</span>
      </div>
      <button class="rail-toggle" id="btn-rail" title="收起导航（⌘/Ctrl+B）" aria-label="收起导航"></button>
    </div>

    <nav class="nav" id="nav" aria-label="功能导航"></nav>

    <div class="sidebar__foot">
      <div class="syschip" title="管理端在本机运行">
        <span class="syschip__pulse" aria-hidden="true"></span>
        <span class="syschip__text">本地部署 · 授权服务</span>
      </div>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <nav class="crumb" id="crumb" aria-label="当前位置">
        <span class="crumb__group" id="crumb-group">授权管理</span>
        <span class="crumb__sep" id="crumb-sep" aria-hidden="true">/</span>
        <span class="crumb__page" id="crumb-page">总览</span>
      </nav>
      <div class="topbar__right">
        <button class="btn btn--ghost btn--sm" id="btn-token" hidden>访问口令</button>
        <div class="seg" role="tablist" aria-label="界面主题">
          <span class="seg__thumb" aria-hidden="true"></span>
          <button class="seg__btn is-active" data-theme-set="a" role="tab" title="浅色（⌘/Ctrl+J 切换）">浅色</button>
          <button class="seg__btn" data-theme-set="b" role="tab" title="深空（⌘/Ctrl+J 切换）">深空</button>
        </div>
        <button class="userchip" id="btn-account" hidden title="账号与安全">
          <span class="userchip__avatar" id="btn-account-initial" aria-hidden="true">A</span>
          <span class="userchip__name" id="btn-account-name">账号</span>
        </button>
      </div>
    </header>

    <div class="scroller">
      <main class="main" id="view" tabindex="-1"></main>
    </div>
  </div>
</div>

<div class="gate" id="gate" hidden>
  <div class="gate__card" id="gate-card"></div>
  <p class="gate__foot">国研智研体 · 授权管理</p>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal__mask" data-modal-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true">
    <header class="modal__head">
      <h2 id="modal-title">标题</h2>
      <button class="icon-btn" data-modal-close aria-label="关闭">×</button>
    </header>
    <div class="modal__body" id="modal-body"></div>
    <footer class="modal__foot" id="modal-foot"></footer>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/assets/app.js"></script>
</body>
</html>
