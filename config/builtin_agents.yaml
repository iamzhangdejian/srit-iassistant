# Built-in Agent Configuration with i18n support
# Each agent has localized name, description, avatar, and config overrides per language.
# The "default" locale is used as fallback when the user's language is not found.

builtin_agents:
  # 桌面版唯一的对话助手。界面上没有智能体选择入口，前端每次请求固定传
  # 这个 ID，用户不必先思考「用哪个模式」再开口。
  #
  # 必须是 smart-reasoning：快速问答走的是只读 RAG 管线，不具备任何文件
  # 写入工具，让它「生成 md 文档」只会得到一段正文，磁盘上不会产生文件。
  # 这里把知识库工具与文件写入都挂上，让模型自己判断是否需要落盘。
  - id: "builtin-main-assistant"
    avatar: "🤖"
    is_builtin: true
    i18n:
      default:
        name: "Assistant"
        description: "Reads the selected knowledge bases and writes finished documents to the workspace"
      zh-CN:
        name: "智研助手"
        description: "检索所选知识库，并把成稿文档写入工作区"
      zh-TW:
        name: "智研助手"
        description: "檢索所選知識庫，並把成稿文件寫入工作區"
      ja-JP:
        name: "リサーチアシスタント"
        description: "選択したナレッジベースを検索し、完成した文書を作業領域に書き出します"
      ko-KR:
        name: "리서치 어시스턴트"
        description: "선택한 지식 베이스를 검색하고 완성된 문서를 작업 공간에 저장합니다"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "rag-qa"
      temperature: 0.7
      max_completion_tokens: 0
      max_iterations: 50
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      # 技能全开：办公文档（PPT/Word/Excel）由技能包提供，助手要先「看见」技能
      # 才能读到 SKILL.md 并调 shell_exec 执行生成脚本。没装技能时这一项无副作用。
      skills_selection_mode: "all"
      # 桌面版技能装在 host 目标上（字面量 "host"，不是 sandbox_configs 行）。
      # 不指定时技能列表接口按配置 id 过滤会返回空，助手就看不到技能。
      sandbox_config_id: "host"
      allowed_tools:
        - "search_knowledge"
        - "read_document"
        - "list_documents"
        - "ask_user"
        # shell_exec 是技能脚本的唯一执行入口（execute_skill_script 已废弃）。
        # allowed_tools 不显式列出的工具不会注册，即便技能已启用也无法运行。
        - "shell_exec"
      web_search_enabled: true
      web_search_max_results: 5
      reflection_enabled: false
      multi_turn_enabled: true
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3

  - id: "builtin-quick-answer"
    avatar: ""
    is_builtin: true
    i18n:
      default:
        name: "Quick Answer"
        description: "Knowledge base RAG Q&A for fast and accurate answers"
      zh-CN:
        name: "快速问答"
        description: "基于知识库的 RAG 问答，快速准确地回答问题"
      zh-TW:
        name: "快速問答"
        description: "基於知識庫的 RAG 問答，快速準確地回答問題"
      ja-JP:
        name: "クイック回答"
        description: "ナレッジベース RAG Q&A による迅速で正確な回答"
      ko-KR:
        name: "빠른 답변"
        description: "지식 베이스 RAG Q&A를 통한 빠르고 정확한 답변"
    config:
      agent_mode: "quick-answer"
      system_prompt_id: "default_kb"
      context_template_id: "default_context"
      temperature: 0.7
      max_completion_tokens: 0
      web_search_enabled: true
      web_search_max_results: 5
      multi_turn_enabled: true
      history_turns: 5
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3
      enable_query_expansion: true
      enable_rewrite: true
      fallback_strategy: "model"

