  - id: "builtin-skill-installer"
    avatar: "📦"
    is_builtin: true
    i18n:
      default:
        name: "Skill Installer"
        description: "Internal agent that installs an uploaded skill and its dependencies into the sandbox image"
      zh-CN:
        name: "技能安装器"
        description: "把上传的技能及其依赖装进沙箱镜像的内部智能体"
      zh-TW:
        name: "技能安裝器"
        description: "把上傳的技能及其相依套件裝進沙箱鏡像的內部智能體"
      ja-JP:
        name: "スキルインストーラー"
        description: "アップロードされたスキルとその依存関係をサンドボックスイメージにインストールする内部エージェント"
      ko-KR:
        name: "스킬 설치 도구"
        description: "업로드된 스킬과 의존성을 샌드박스 이미지에 설치하는 내부 에이전트"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "skill_installer"
      temperature: 0.2
      max_completion_tokens: 24576
      max_iterations: 30
      kb_selection_mode: "none"
      retrieve_kb_only_when_mentioned: false
      # The install path unions these three in regardless of what is written
      # here: an install that cannot write its own skill directory cannot
      # record what it did. They are listed for accuracy, not as the source of
      # truth. write_skill_file / edit_skill_file reach only the one skill
      # being installed and are never offered to a tenant-editable agent.
      allowed_tools:
        - "shell_exec"
        - "write_skill_file"
        - "edit_skill_file"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true


  - id: "builtin-weknora-assistant"
    avatar: "🧭"
    is_builtin: true
    i18n:
      default:
        name: "国研智研体 助手"
        description: "Answers how 国研智研体 works and manages your workspace: document parsing, knowledge base activity, Wiki health and repairs"
      zh-CN:
        name: "国研智研体 助手"
        description: "解答 国研智研体 用法，查看和管理你的空间：文档解析、知识库动态、Wiki 健康与修订"
      zh-TW:
        name: "国研智研体 助手"
        description: "解答 国研智研体 用法，檢視和管理你的空間：文件解析、知識庫動態、Wiki 健康與修訂"
      ja-JP:
        name: "国研智研体 助手"
        description: "国研智研体 の使い方に答え、ワークスペースを確認・管理：ドキュメント解析、ナレッジベースの履歴、Wiki の健全性と修正"
      ko-KR:
        name: "国研智研体 어시스턴트"
        description: "国研智研体 사용법 안내와 워크스페이스 확인 및 관리: 문서 파싱, 지식 베이스 활동, Wiki 상태 점검과 수정"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "weknora_assistant"
      temperature: 0.3
      max_completion_tokens: 24576
      max_iterations: -1
      # The workspace assistant can read the caller's accessible bases. Explicit
      # mentions still narrow a turn; the current page is only contextual data.
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      retain_retrieval_history: true
      # find_operations / run_operation and search_weknora_docs /
      # read_weknora_doc are not listed: they are granted to this agent by ID
      # at run time (types.GrantsOperationCatalog, types.GrantsProductDocs) and
      # can never be selected on a tenant-editable agent.
      allowed_tools:
        - "ask_user"
        - "todo_write"
        - "search_knowledge"
        - "read_document"
        - "list_documents"
        - "wiki_search"
        - "wiki_read_page"
        - "wiki_write_page"
        - "wiki_replace_text"
        - "wiki_rename_page"
        - "wiki_delete_page"
        - "wiki_flag_issue"
        - "wiki_read_issue"
        - "wiki_update_issue"
      # web_search / web_fetch let it find a skill's or MCP service's source
      # from a description. They follow this switch rather than allowed_tools,
      # and web_search still needs a provider configured in the workspace.
      web_search_enabled: true
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3
