name: Desktop Windows

# Windows 版桌面应用（.exe + NSIS 安装包）。
#
# 为什么不在 macOS 上交叉编译：本项目所有存储/解析依赖都是 cgo
# （mattn-sqlite3、sqlite-vec、duckdb、anydoc），交叉编译需要一套完整的
# MinGW-w64 工具链，而 anydoc 还要额外产出 x86_64-pc-windows-gnu 的静态库。
# 直接用 Windows runner 只需要 runner 自带的那套 gcc，比在开发机上搭交叉
# 工具链稳定得多。macOS 上仍可用
#   TARGET=windows/amd64 bash scripts/oem-build-lite.sh
# 交叉编译（脚本会检查 mingw 是否存在），只是本仓库不把那条路当主路径。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则读 VERSION 文件）"
        required: false
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1
      # windows-latest 自带 MinGW-w64（Git for Windows / msys2），两个名字都试。
      MINGW_CC: gcc
      MINGW_CXX: g++
      GOLANG_PROTOBUF_REGISTRATION_CONFLICT: warn
      # Windows runner 默认 Node 堆上限约 2GB，vite 打包这份前端会 OOM
      # （实测 "FATAL ERROR: Reached heap limit"）。wails build 内部也会调 vite，
      # 所以放在 job 级 env，两步都吃得到。
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # duckdb 的 windows-amd64 预编译静态库是按 **UCRT + posix 线程模型** 编的：
      #   - 缺 UCRT 会报 __stdio_common_vsnprintf_s / __imp___timezone 未定义
      #   - 缺 winpthreads 会报 pthread_mutex_* 未定义
      # runner 自带的 mingw 未必满足（Chocolatey 的 mingw 是 MSVCRT/win32），
      # 所以显式装 MSYS2 的 UCRT64 工具链并把它放到 PATH 最前面。
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Use UCRT64 toolchain
        shell: bash
        run: |
          # setup-msys2 的安装位置随 runner 变化（D:\a\_temp\setup-msys2 或 C:\msys64），
          # 不能写死。用 action 的输出定位，再把 ucrt64/bin 前置到 PATH。
          MSYS2_ROOT="${{ steps.msys2.outputs.msys2-location }}"
          echo "msys2 root: $MSYS2_ROOT"
          ls "$MSYS2_ROOT/ucrt64/bin/gcc.exe" || {
            echo "::error::找不到 $MSYS2_ROOT/ucrt64/bin/gcc.exe"
            exit 1
          }
          echo "$MSYS2_ROOT/ucrt64/bin" >> "$GITHUB_PATH"

          export PATH="$MSYS2_ROOT/ucrt64/bin:$PATH"
          which gcc
          gcc -dumpmachine
          gcc -v 2>&1 | grep -E "Thread model|gcc version" | head -2

          # 把关「用的是 UCRT64 这一套」：看解析到的 gcc 落在 ucrt64 目录下、
          # 目标三元组是 x86_64-w64-mingw32、线程模型是 posix（duckdb 预编译库要求）。
          # 不用 `gcc -dM -E -x c /dev/null`：Git Bash 的 /dev/null 传给 ucrt64 gcc
          # 会被当成不存在的 Windows 路径，输出为空 —— 上一版就是这么误判的。
          gcc_path="$(command -v gcc)"
          echo "gcc resolves to: $gcc_path"
          case "$gcc_path" in
            *ucrt64*) ;;
            *) echo "::error::gcc 不在 ucrt64 目录下（$gcc_path）；duckdb 预编译库要求 UCRT64"; exit 1 ;;
          esac
          machine="$(gcc -dumpmachine)"
          [[ "$machine" == "x86_64-w64-mingw32" ]] || {
            echo "::error::gcc 目标三元组是 '$machine'，期望 x86_64-w64-mingw32"; exit 1; }
          gcc -v 2>&1 | grep -q "Thread model: posix" || {
            echo "::error::gcc 不是 posix 线程模型（duckdb 预编译库需要 winpthreads）"; exit 1; }
          echo "UCRT64 toolchain ready"

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        shell: bash
        run: |
          choco install nsis -y --no-progress
          # choco 装的 makensis 不在默认 PATH 里，脚本探测不到就只出 exe 不出安装包
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
          ls "/c/Program Files (x86)/NSIS/makensis.exe" || true

      - name: Install Rust + windows-gnu target
        shell: bash
        run: |
          # anydoc 的静态库必须用 gnu triple 编，Go 侧是
          #   #cgo windows,amd64 LDFLAGS: -L${SRCDIR}/lib/windows_amd64 -lanydoc_go
          # 并且链接器和 CGO 用的是同一套 MinGW，避免 libstdc++ ABI 对不上。
          rustup target add x86_64-pc-windows-gnu
          rustc --version
          gcc --version | head -1

      - name: Build anydoc static lib
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: TARGET=x86_64-pc-windows-gnu bash scripts/build-anydoc-lib.sh

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          # package-lock 与 package.json 一旦不同步，npm ci 会硬失败；CI 里退化成
          # npm install 更实用（本地仍有 lockfile 兜版本）。
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      # anydoc 的 windows 静态库（rayon 线程池）引用 WaitOnAddress / WakeByAddress* /
      # RtlNtStatusToDosError / NtReadFile / NtWriteFile，这些 API 分散在
      # synchronization / ntdll / mingwex 等导入库里，需要补齐。
      # （DuckDB 已在 -tags noduckdb 下排除，不再需要 emutls 兼容层。）
      - name: Windows link libs
        shell: bash
        run: |
          set -euo pipefail
          extra=""
          for lib in synchronization ntdll mingwex ws2_32 rstrtmgr ole32 userenv bcrypt shlwapi winpthread; do
            f="$(gcc -print-file-name=lib$lib.a)"
            if [ -f "$f" ]; then extra="$extra -l$lib"; fi
          done
          echo "→ 补充导入库：${extra:-（无）}"
          echo "CGO_LDFLAGS=${extra}" >> "$GITHUB_ENV"

      # 客户机可能没装 WebView2（Win10 早期版本、精简镜像、或运行时被策略移除），
      # 而 Wails 应用没有 WebView2 就起不到窗口。安装包里的 NSI 已有检测 +
      # ExecWait /silent /install 分支，这里只负责把官方引导器放进仓库根，
      # package-windows.ps1 会把它拷进 staging 并随安装包一起分发。
      - name: Fetch WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "MicrosoftEdgeWebview2Setup.exe" -UseBasicParsing
          Get-Item "MicrosoftEdgeWebview2Setup.exe" | Select-Object Name, Length

      - name: Build desktop app
        shell: bash
        run: bash scripts/oem-build-lite.sh
        env:
          TARGET: windows/amd64
          APP_NAME: 国研智研体
          UPDATE_REPO: ${{ vars.WEKNORA_UPDATE_REPO }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp -v cmd/desktop/build/bin/*.exe out/ 2>/dev/null || true
          cp -v cmd/desktop/build/bin/*Setup.exe out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-amd64
          path: out/
          retention-days: 7