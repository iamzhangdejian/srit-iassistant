name: Desktop Windows

# Windows 版桌面应用（.exe + NSIS 安装包）。
#
# 为什么不在 macOS 上交叉编译：本项目所有存储/解析依赖都是 cgo
# （mattn-sqlite3、sqlite-vec、duckdb、anydoc），交叉编译需要一套完整的
# MinGW-w64 工具链，而 anydoc 还要额外产出 x86_64-pc-windows-gnu 的静态库。
# 直接用 Windows runner 只需要 runner 自带的那套 gcc，比在开发机上搭交叉
# 工具链稳定得多。macOS 上仍可用
#   TARGET=windows/amd64 bash scripts/oem-build-lite.sh
# 交叉编译（脚本会检查 mingw 是否存在），只是本仓库不把那条路当主路径。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则读 VERSION 文件）"
        required: false
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1
      # windows-latest 自带 MinGW-w64（Git for Windows / msys2），两个名字都试。
      MINGW_CC: gcc
      MINGW_CXX: g++
      GOLANG_PROTOBUF_REGISTRATION_CONFLICT: warn
      # Windows runner 默认 Node 堆上限约 2GB，vite 打包这份前端会 OOM
      # （实测 "FATAL ERROR: Reached heap limit"）。wails build 内部也会调 vite，
      # 所以放在 job 级 env，两步都吃得到。
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # duckdb 的 windows-amd64 预编译静态库是按 **UCRT + posix 线程模型** 编的：
      #   - 缺 UCRT 会报 __stdio_common_vsnprintf_s / __imp___timezone 未定义
      #   - 缺 winpthreads 会报 pthread_mutex_* 未定义
      # runner 自带的 mingw 未必满足（Chocolatey 的 mingw 是 MSVCRT/win32），
      # 所以显式装 MSYS2 的 UCRT64 工具链并把它放到 PATH 最前面。
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Use UCRT64 toolchain
        shell: bash
        run: |
          # setup-msys2 的安装位置随 runner 变化（D:\a\_temp\setup-msys2 或 C:\msys64），
          # 不能写死。用 action 的输出定位，再把 ucrt64/bin 前置到 PATH。
          MSYS2_ROOT="${{ steps.msys2.outputs.msys2-location }}"
          echo "msys2 root: $MSYS2_ROOT"
          ls "$MSYS2_ROOT/ucrt64/bin/gcc.exe" || {
            echo "::error::找不到 $MSYS2_ROOT/ucrt64/bin/gcc.exe"
            exit 1
          }
          echo "$MSYS2_ROOT/ucrt64/bin" >> "$GITHUB_PATH"

          export PATH="$MSYS2_ROOT/ucrt64/bin:$PATH"
          which gcc
          gcc -dumpmachine
          gcc -v 2>&1 | grep -E "Thread model|gcc version" | head -2

          # 把关「用的是 UCRT64 这一套」：看解析到的 gcc 落在 ucrt64 目录下、
          # 目标三元组是 x86_64-w64-mingw32、线程模型是 posix（duckdb 预编译库要求）。
          # 不用 `gcc -dM -E -x c /dev/null`：Git Bash 的 /dev/null 传给 ucrt64 gcc
          # 会被当成不存在的 Windows 路径，输出为空 —— 上一版就是这么误判的。
          gcc_path="$(command -v gcc)"
          echo "gcc resolves to: $gcc_path"
          case "$gcc_path" in
            *ucrt64*) ;;
            *) echo "::error::gcc 不在 ucrt64 目录下（$gcc_path）；duckdb 预编译库要求 UCRT64"; exit 1 ;;
          esac
          machine="$(gcc -dumpmachine)"
          [[ "$machine" == "x86_64-w64-mingw32" ]] || {
            echo "::error::gcc 目标三元组是 '$machine'，期望 x86_64-w64-mingw32"; exit 1; }
          gcc -v 2>&1 | grep -q "Thread model: posix" || {
            echo "::error::gcc 不是 posix 线程模型（duckdb 预编译库需要 winpthreads）"; exit 1; }
          echo "UCRT64 toolchain ready"

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        shell: bash
        run: choco install nsis -y --no-progress

      - name: Install Rust + windows-gnu target
        shell: bash
        run: |
          # anydoc 的静态库必须用 gnu triple 编，Go 侧是
          #   #cgo windows,amd64 LDFLAGS: -L${SRCDIR}/lib/windows_amd64 -lanydoc_go
          # 并且链接器和 CGO 用的是同一套 MinGW，避免 libstdc++ ABI 对不上。
          rustup target add x86_64-pc-windows-gnu
          rustc --version
          gcc --version | head -1

      - name: Build anydoc static lib
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: TARGET=x86_64-pc-windows-gnu bash scripts/build-anydoc-lib.sh

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          # package-lock 与 package.json 一旦不同步，npm ci 会硬失败；CI 里退化成
          # npm install 更实用（本地仍有 lockfile 兜版本）。
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      # duckdb-go-bindings 的 Windows 预编译库是拿较老的 mingw GCC 编的：
      # 里面的 std::call_once 内联代码引用 std::__once_call / __once_callable
      # 这两个 emutls 变量，而 UCRT64 的 libstdc++（GCC 16）已不再定义它们，
      # 于是链接期报 undefined reference to `__emutls_v._ZSt11__once_call`。
      # 同时 rayon（anydoc）与 re2 需要 WaitOnAddress/WakeByAddress*、ntdll 系列
      # 导入库。这一步把两件事都补上，产物只在链接期用到，不影响运行时语义。
      # duckdb-go-bindings 的 Windows 预编译库是用 clang/mingw 且开启「模拟 TLS」
      # (-femulated-tls) 编出来的：它的 std::call_once 内联代码引用
      # __emutls_v._ZSt11__once_call / __emutls_v._ZSt15__once_callable 这两个
      # emutls 控制块，而 UCRT64 的 libstdc++（GCC 16，原生 TLS）不再定义它们。
      # 因此这里用 clang + -femulated-tls 生成一份**同构**的控制块（布局由编译器
      # 生成，不手写结构体），再用 whole-archive 强制带进链接。
      # duckdb-go-bindings 的 Windows 预编译库是用 clang + 「模拟 TLS」(-femulated-tls)
      # 编出来的：它内联的 std::call_once 引用 __emutls_v._ZSt11__once_call /
      # __emutls_v._ZSt15__once_callable 这两个 emutls 控制块，并调用
      # __emutls_get_address；而 UCRT64 的 GCC 16 用原生 TLS，既没有这两个符号，
      # libgcc 里也没有 emutls 运行时。这里用 UCRT64 的 clang 以同样的
      # -femulated-tls 生成控制块，并显式链接 compiler-rt 的 emutls 运行时。
      - name: Windows link compat libs
        shell: bash
        run: |
          set -euo pipefail
          dir="$(pwd)/tools/wincompat"
          mkdir -p "$dir"
          cat > "$dir/once_shim.cc" <<'CPP'
          // 老 ABI（libstdc++ <= 13）的 std::call_once 支撑变量。
          #include <cstddef>
          namespace std {
          thread_local void* __once_call = nullptr;
          thread_local void* __once_callable = nullptr;
          }
          CPP

          msys2_root="$(cd "$(dirname "$(command -v gcc)")/../.." && pwd)"
          pacman_bin="$msys2_root/usr/bin/pacman.exe"
          echo "msys2 根：$msys2_root"
          if [ -x "$pacman_bin" ] && "$pacman_bin" -S --noconfirm --needed mingw-w64-ucrt-x86_64-clang >/tmp/clang-install.log 2>&1; then
            echo "→ clang 已安装"
          else
            echo "::warning::clang 安装失败"
            tail -10 /tmp/clang-install.log 2>/dev/null || true
          fi

          shim_ok=0
          clang_bin="$(command -v clang++ || true)"
          if [ -n "$clang_bin" ]; then
            echo "clang++: $clang_bin ($("$clang_bin" --version | head -1))"
            if "$clang_bin" --target=x86_64-w64-windows-gnu -femulated-tls -O2 -c "$dir/once_shim.cc" -o "$dir/once_shim.o" 2>"$dir/shim.err"; then
              shim_ok=1
              echo "→ 兼容层用 clang -femulated-tls 生成"
            else
              echo "::warning::clang 模拟 TLS 编译失败"
              sed -n '1,10p' "$dir/shim.err"
            fi
          fi
          if [ "$shim_ok" = 0 ]; then
            echo "::warning::退回 g++（原生 TLS，仍会缺 __emutls_v.*）"
            g++ -O2 -c "$dir/once_shim.cc" -o "$dir/once_shim.o" 2>>"$dir/shim.err" && shim_ok=1
          fi

          extra=""
          if [ "$shim_ok" = 1 ]; then
            ar rcs "$dir/libwincompat.a" "$dir/once_shim.o"
            echo "--- libwincompat 定义的符号 ---"
            nm --defined-only "$dir/libwincompat.a" | grep -i "once\|emutls" || true
            if nm --defined-only "$dir/libwincompat.a" | grep -q "__emutls_v._ZSt11__once_call"; then
              echo "✓ 已生成 emutls 控制块"
            else
              echo "::warning::兼容层没有 __emutls_v._ZSt11__once_call"
            fi
            extra="-L$(cygpath -m "$dir") -Wl,--whole-archive -lwincompat -Wl,--no-whole-archive"
          fi

          # compiler-rt 的 emutls 运行时（模拟 TLS 时 __emutls_get_address 在这里）
          for rt in "$(dirname "$(command -v gcc)")/../lib/clang/"*/lib/windows/libclang_rt.builtins-x86_64.a \
                    "$(dirname "$(command -v gcc)")"/../lib/clang/*/lib/windows/libclang_rt.builtins*.a; do
            if [ -f "$rt" ] && nm "$rt" 2>/dev/null | grep -q "__emutls_get_address"; then
              echo "→ emutls 运行时：$rt"
              extra="$extra -Wl,--whole-archive $(cygpath -m "$rt") -Wl,--no-whole-archive"
              break
            fi
          done
          echo "--- libgcc 是否提供 __emutls_get_address ---"
          nm "$(gcc -print-file-name=libgcc.a)" 2>/dev/null | grep -w "__emutls_get_address" | head -3 || echo "  （未找到）"

          for lib in synchronization ntdll mingwex ws2_32 rstrtmgr ole32 userenv bcrypt shlwapi winpthread; do
            f="$(gcc -print-file-name=lib$lib.a)"
            if [ -f "$f" ]; then extra="$extra -l$lib"; fi
          done
          echo "→ 链接兼容参数：${extra:-（无）}"
          echo "CGO_LDFLAGS=${extra}" >> "$GITHUB_ENV"

      - name: Build desktop app
        shell: bash
        run: bash scripts/oem-build-lite.sh
        env:
          TARGET: windows/amd64
          APP_NAME: 国研智研体
          UPDATE_REPO: ${{ vars.WEKNORA_UPDATE_REPO }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp -v cmd/desktop/build/bin/*.exe out/ 2>/dev/null || true
          cp -v cmd/desktop/build/bin/*Setup.exe out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-amd64
          path: out/
          retention-days: 7